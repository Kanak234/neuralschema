[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralschema"
version = "0.1.0"
description = "Universal code & system architecture analyzer"
readme = "README.md"
authors = [{ name = "Kanak234" }]
requires-python = ">=3.10"
dependencies = [
    "networkx>=2.8.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
neuralschema = "neural_schema:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E722", "E741"]
